name: Label-based Project Management

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: number
      repository:
        description: 'Repository name (org/repo format)'
        required: true
        type: string
      label_name:
        description: 'Label that was added or removed'
        required: true
        type: string
      action:
        description: 'Action: labeled or unlabeled'
        required: true
        type: string
    secrets:
      gh_token:
        description: 'GitHub token with project write permissions'
        required: true

# NOTE: Do not add a concurrency group here. Every caller of this reusable workflow
# (issue-project-automation.yml) already declares the same concurrency group at the
# top level, and a reusable workflow re-declaring that identical group deadlocks:
# GitHub cancels the run with "deadlock detected ... between a top level workflow
# and <this job>" because the calling run can't complete until this one does, and
# this one can't acquire the group the calling run is still holding.

jobs:
  handle-label:
    runs-on: ubuntu-latest
    name: Handle label-based project automation

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          repository: NASA-PDS/.github
          sparse-checkout: |
            .github/scripts
            conf
          sparse-checkout-cone-mode: false

      - name: Process build label
        if: inputs.action == 'labeled' && startsWith(inputs.label_name, 'B') && inputs.label_name != 'bug'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          # Extract org from repository
          org=$(echo "${{ inputs.repository }}" | cut -d'/' -f1)

          # --set-sprint-if-backlog: also set current sprint if sprint-backlog is already on the issue
          python3 .github/scripts/project_automation.py \
            add-to-build-project \
            --repository "${{ inputs.repository }}" \
            --issue-number ${{ inputs.issue_number }} \
            --org "$org" \
            --label "${{ inputs.label_name }}" \
            --set-sprint-if-backlog

          # Also set org-level Product and Work Area fields
          python3 .github/scripts/project_automation.py \
            sync-fields \
            --repository "${{ inputs.repository }}" \
            --issue-number ${{ inputs.issue_number }} \
            --org "$org" \
            --config conf/pds-products.yaml \
            --set-product-field \
            --set-work-area || true

          # Cascade build label to all sub-issues
          python3 .github/scripts/project_automation.py \
            cascade-label \
            --repository "${{ inputs.repository }}" \
            --issue-number ${{ inputs.issue_number }} \
            --label "${{ inputs.label_name }}" \
            --label-action add || true

      - name: Add to sprint when sprint-backlog label added
        if: inputs.action == 'labeled' && inputs.label_name == 'sprint-backlog'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          # Extract org from repository
          org=$(echo "${{ inputs.repository }}" | cut -d'/' -f1)

          # Run Python automation script
          python3 .github/scripts/project_automation.py \
            add-to-sprint \
            --repository "${{ inputs.repository }}" \
            --issue-number ${{ inputs.issue_number }} \
            --org "$org"

      - name: Remove from sprint when sprint-backlog label removed
        if: inputs.action == 'unlabeled' && inputs.label_name == 'sprint-backlog'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          # Extract org from repository
          org=$(echo "${{ inputs.repository }}" | cut -d'/' -f1)

          # Run Python automation script
          python3 .github/scripts/project_automation.py \
            remove-from-sprint \
            --repository "${{ inputs.repository }}" \
            --issue-number ${{ inputs.issue_number }} \
            --org "$org"

      - name: Remove from build project when build label removed
        if: inputs.action == 'unlabeled' && startsWith(inputs.label_name, 'B') && inputs.label_name != 'bug'
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          org=$(echo "${{ inputs.repository }}" | cut -d'/' -f1)

          python3 .github/scripts/project_automation.py \
            remove-from-build-project \
            --repository "${{ inputs.repository }}" \
            --issue-number ${{ inputs.issue_number }} \
            --org "$org" \
            --label "${{ inputs.label_name }}"

          # Cascade label removal to all sub-issues
          python3 .github/scripts/project_automation.py \
            cascade-label \
            --repository "${{ inputs.repository }}" \
            --issue-number ${{ inputs.issue_number }} \
            --label "${{ inputs.label_name }}" \
            --label-action remove || true
