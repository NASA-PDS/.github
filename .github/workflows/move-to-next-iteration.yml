name: Moves Issues To Current Sprint

on:
  schedule:
    # Runs "at 07:00, only on Thursday" (see https://crontab.guru)
    - cron: '0 14 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: list the items that would move without changing the project'
        type: boolean
        default: false

jobs:
  move-to-next-iteration:
    name: Move to next iteration
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Keepalive — prevent GitHub from disabling this scheduled workflow
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.ADMIN_GITHUB_TOKEN }}

    - name: Push empty commit to reset inactivity timer
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit --allow-empty -m "chore: keepalive [skip ci]"
        git push

    - name: Move items from the last iteration to the current iteration
      env:
        GH_TOKEN: ${{ secrets.ORG_PROJECT_PAT }}
        PROJECT_OWNER: NASA-PDS
        PROJECT_NUMBER: '34'    # NOTE THIS NEEDS TO BE UPDATED EVERY BUILD CHANGE!
        ITERATION_FIELD: sprint
        FROM_ITERATION: last
        TO_ITERATION: current
        EXCLUDED_STATUSES: 'Done'
        DRY_RUN: ${{ inputs.dry_run }}
      run: python3 .github/scripts/move_to_next_iteration.py
